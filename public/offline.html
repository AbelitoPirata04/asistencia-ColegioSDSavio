<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#C40000">
<title>Sin conexión · Colegio Santo Domingo Savio</title>
<style>
  *{box-sizing:border-box;margin:0}
  body{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:#F2F2EF;color:#1D1B1A;
       font:400 15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
  main{max-width:360px}
  img{width:96px;height:auto;margin-bottom:22px}
  h1{font-size:22px;font-weight:700;margin-bottom:8px}
  p{color:#625E5A;margin-bottom:22px}
  button{font-family:inherit;font-size:15px;font-weight:600;padding:11px 22px;border:0;border-radius:10px;background:#C40000;color:#fff;cursor:pointer}
  button:hover{background:#A30000}
  button:focus-visible{outline:2px solid #1D1B1A;outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/img/logo_pequeno.png" alt="Escudo del Colegio Santo Domingo Savio">
  <h1>Sin conexión a internet</h1>
  <p>La asistencia se consulta en línea. Revise el WiFi o los datos del dispositivo y vuelva a intentarlo.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
